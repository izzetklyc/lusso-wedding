  ]).then(function(r){
    if(sira!==aj.sira)return;
    var e=r[0].error||r[1].error||r[2].error;
    if(e){if(sessiz)return;aj.hata=ajHata(e);aj.gun=null;ajCiz();return;}
    if(sessiz&&(aj.kirli||aj.rtKirli||ajOdakta()))return;
    var x=r[0].data,yeni=ajBosGun();
    if(x){
      yeni={odak:String(x.odak||''),isler:Array.isArray(x.isler)?x.isler.map(function(s){return String(s==null?'':s);}):[],notlar:String(x.notlar||''),
            rutin:(x.rutin&&typeof x.rutin==='object'&&!Array.isArray(x.rutin))?x.rutin:{},guncelleyen:x.guncelleyen||null,guncelleme:x.guncelleme||null};
    }
    var liste=(r[2].data&&Array.isArray(r[2].data.liste))?temizRutin(r[2].data.liste):rutinVarsayilan(dep);
    var gorevler=Array.isArray(r[1].data)?r[1].data:[];
    var imza=JSON.stringify([dep,tarih,yeni,gorevler,liste]);
    if(sessiz&&imza===aj.imza)return;
    aj.imza=imza;aj.gun=yeni;aj.gorevler=gorevler;aj.rutin=liste;aj.rutinTaslak=clone(liste);aj.rtKirli=false;aj.hata='';
    aj.satir=Math.max(10,yeni.isler.length);
    ajCiz();
  }).catch(function(e){if(sira!==aj.sira||sessiz)return;aj.hata=ajHata(e);aj.gun=null;ajCiz();});
}

/* Gün sayfası: yazdıkça kaydedilir */
function ajDegisti(hemen){
  aj.kirli=true;ajDurum('Kaydediliyor…');
  clearTimeout(ajT);ajT=setTimeout(ajKaydet,hemen?120:700);
}
/* Kayıt gitmediyse yazı ekranda durur; bağlantı gelene kadar 5 saniyede bir kendiliğinden yeniden denenir. */
function ajKalan(dep,tarih,e){
  aj.kirli=true;
  if(aj.dep===dep&&aj.tarih===tarih)ajDurum('Kaydedilemedi: '+ajHata(e)+' Yeniden denenecek.','bad');
  clearTimeout(ajT);ajT=setTimeout(ajKaydet,5000);
}
function ajKaydet(){
  clearTimeout(ajT);ajT=null;
  if(!aj.kirli||!sb||!aj.gun||!aj.dep)return Promise.resolve();
  var dep=aj.dep,tarih=aj.tarih,g=aj.gun;
  var isler=g.isler.map(function(s){return String(s||'').trim().slice(0,300);});
  while(isler.length&&!isler[isler.length-1])isler.pop();
  var rutin={};Object.keys(g.rutin).forEach(function(k){if(g.rutin[k])rutin[k]=true;});
  var satir={departman:dep,tarih:tarih,odak:String(g.odak||'').trim().slice(0,500),isler:isler,notlar:String(g.notlar||'').trim().slice(0,4000),rutin:rutin};
  aj.kirli=false;
  return sb.from('ajanda_gun').upsert(satir,{onConflict:'departman,tarih'}).then(function(r){
    if(r.error){ajKalan(dep,tarih,r.error);return;}
    if(aj.dep===dep&&aj.tarih===tarih){
      g.guncelleyen=benId;g.guncelleme=new Date().toISOString();
      if(!aj.kirli)ajDurum('✓ Kaydedildi · '+ajSaat(),'ok');
      var m=$('aj-meta');if(m)m.textContent=ajMeta(g);
    }
  }).catch(function(e){ajKalan(dep,tarih,e);});
}
/* Başka güne / departmana geçmeden önce bekleyen değişiklik kaydedilir */
function ajGit(dep,tarih){
  var p=aj.kirli?ajKaydet():Promise.resolve();
  Promise.resolve(p).then(function(){
    if(aj.kirli)return;
    if(tarih<BASLANGIC_GUN)tarih=BASLANGIC_GUN;
    if(tarih>enGecGun())tarih=enGecGun();
    aj.dep=dep;aj.tarih=tarih;aj.rtKirli=false;ajYukle();
  });
}
function ajGunKaydir(n){var d=toDate(aj.tarih);d.setDate(d.getDate()+n);ajGit(aj.dep,dateStr(d));}
function ajMeta(g){
  if(!g||!g.guncelleme)return 'Bu gün için henüz kayıt yok.';
  var ad=g.guncelleyen?kullaniciAdi(g.guncelleyen):'';
  return 'Son kayıt: '+(ad?ad+' · ':'')+fmtZaman(g.guncelleme);
}

/* ---------- çizim ---------- */
function ajRender(){
  var deps=ajDepler(),el=$('aj');
  if(!deps.length){el.innerHTML='';return;}
  if(deps.indexOf(aj.dep)<0){aj.dep=deps[0];aj.tarih=aj.tarih||todayStr();aj.gun=null;aj.kirli=false;aj.rtKirli=false;ajYukle();return;}
  if(!el.firstChild)ajCiz();
}
function ajCiz(){
  var el=$('aj');if(!el)return;
  if(!ajErisim()||!aj.dep){el.innerHTML='';return;}
  var deps=ajDepler(),acik=aj.gorevler.filter(function(g){return !g.yapildi;}).length,h='';
  h+='<div class="phead"><h1>'+esc(DEPARTMAN[aj.dep].ad)+' · Ajanda</h1><span class="ajdurum" id="aj-durum"></span></div><div class="ajust">';
  if(deps.length>1){
    h+='<div class="seg" role="group" aria-label="Departman">';
    deps.forEach(function(d){h+='<button type="button" data-ajdep="'+d+'" aria-pressed="'+(d===aj.dep)+'">'+DEPARTMAN[d].ad+'</button>';});
    h+='</div>';
  }
  h+='<div class="seg" role="group" aria-label="Sayfa"><button type="button" data-ajsekme="gun" aria-pressed="'+(aj.sekme==='gun')+'">Gün sayfası</button>'+
     '<button type="button" data-ajsekme="gorev" aria-pressed="'+(aj.sekme==='gorev')+'">Görevler'+(acik?' ('+acik+')':'')+'</button></div></div>';
  if(aj.hata)h+='<p class="banner">'+esc(aj.hata)+'</p>';
  else if(!aj.gun)h+='<p class="fine">Yükleniyor…</p>';
  else h+=aj.sekme==='gorev'?ajGorevHtml():ajGunHtml();
  el.innerHTML=h;
  ajDurum(aj.durum,aj.durumTur);
}
function ajGunHtml(){
  var g=aj.gun,bugun=aj.tarih===todayStr(),n=Math.max(aj.satir,g.isler.length,10),i,h='';
  h+='<div class="ajnav"><button type="button" class="nbtn arrow" id="aj-once" aria-label="Önceki gün"'+(aj.tarih<=BASLANGIC_GUN?' disabled':'')+'>&#8249;</button>'+
     '<input type="date" id="aj-tarih" value="'+aj.tarih+'" min="'+BASLANGIC_GUN+'" max="'+enGecGun()+'" aria-label="Tarih">'+
     '<button type="button" class="nbtn arrow" id="aj-sonra" aria-label="Sonraki gün"'+(aj.tarih>=enGecGun()?' disabled':'')+'>&#8250;</button>'+
     (bugun?'':'<button type="button" class="nbtn" id="aj-bugun">Bugün</button>')+
     '<span class="ajgun">'+fmtUzun(aj.tarih)+(bugun?'<i>Bugün</i>':'')+'</span></div>';
  h+='<section class="ablok"><h2>Günün odağı</h2><p class="fine">Bugün üzerinde çalışılacak tek ana konu.</p>'+
     '<textarea class="ain oto" id="aj-odak" maxlength="500" aria-label="Günün odağı">'+esc(g.odak)+'</textarea></section>';
  h+='<section class="ablok"><h2>Yapılan işler</h2>';
  for(i=0;i<n;i++)h+='<div class="ajis"><span>•</span><input type="text" class="ain" id="aj-is-'+i+'" data-is="'+i+'" maxlength="300" autocomplete="off" value="'+esc(g.isler[i]||'')+'" aria-label="Yapılan iş '+(i+1)+'"></div>';
  h+='<button type="button" class="ekle" id="aj-is-ekle">+ Satır ekle</button></section>';
  h+='<section class="ablok"><h2>Not</h2><textarea class="ain oto" id="aj-not" maxlength="4000" aria-label="Not">'+esc(g.notlar)+'</textarea></section>';
  var yap=aj.rutin.filter(function(r){return g.rutin[r.id];}).length;
  h+='<section class="ablok"><h2>Rutin işler<span class="ajsay" id="aj-rsay">'+yap+' / '+aj.rutin.length+' yapıldı</span></h2>'+
     '<p class="fine">Her gün aynı liste. Yapılan işin düğmesine basın; satır yeşile döner. Listeyi değiştirmek için Görevler sayfasındaki ana listeyi düzenleyin.</p>';
  aj.rutin.forEach(function(r,k){
    var ok=!!g.rutin[r.id];
    h+='<div class="ajr '+(ok?'yapildi':'yapilmadi')+'"><span class="sn">'+(k+1)+'</span><span class="mt">'+esc(r.metin)+'</span>'+
       '<button type="button" class="ajd" data-rutin="'+esc(r.id)+'" aria-pressed="'+ok+'">'+(ok?'✓ Yapıldı':'✗ Yapılmadı')+'</button></div>';
  });
  if(!aj.rutin.length)h+='<p class="fine">Rutin iş tanımlı değil.</p>';
  h+='</section><p class="ajalt" id="aj-meta">'+esc(ajMeta(g))+'</p>';
  return h;
}
function ajGorevSatir(g,i){
  return '<div class="ajr gorev '+(g.yapildi?'yapildi':'yapilmadi')+'"><span class="sn">'+(i+1)+'</span>'+
    '<input type="text" class="ain" data-gorev="'+esc(g.id)+'" maxlength="300" autocomplete="off" value="'+esc(g.metin)+'" aria-label="Görev '+(i+1)+'">'+
    '<button type="button" class="ajd" data-gorev-durum="'+esc(g.id)+'" aria-pressed="'+!!g.yapildi+'">'+(g.yapildi?'✓ Yapıldı':'✗ Yapılmadı')+'</button>'+
    '<button type="button" class="sil" data-gorev-sil="'+esc(g.id)+'" aria-label="Görevi sil">&times;</button></div>';
}
function ajGorevHtml(){
  var acik=aj.gorevler.filter(function(g){return !g.yapildi;}),
      bitti=aj.gorevler.filter(function(g){return g.yapildi;}).sort(function(a,b){return String(b.tamamlanma||'').localeCompare(String(a.tamamlanma||''));}),h='';
  h+='<section class="ablok"><h2>Görevler</h2><p class="fine">Görevi yazıp ekleyin. Tamamlanınca düğmesine basın; satır yeşile döner.'+(st.admin?' Yönetici olarak bu departmana görev verebilirsiniz.':'')+'</p>'+
     '<form id="aj-gorev-yeni" class="ajyeni" novalidate><input type="text" class="ain" id="aj-gorev-metin" maxlength="300" autocomplete="off" placeholder="Yeni görev" aria-label="Yeni görev">'+
     '<button type="submit" class="btn primary" id="aj-gorev-ekle">Görev ekle</button></form>';
  acik.forEach(function(g,i){h+=ajGorevSatir(g,i);});
  if(!acik.length)h+='<p class="fine">Açık görev yok.</p>';
  if(bitti.length){
    var gos=aj.tumYapilan?bitti:bitti.slice(0,10);
    h+='<p class="ajbaslik">Yapılan görevler ('+bitti.length+')</p>';
    gos.forEach(function(g,i){h+=ajGorevSatir(g,i);});
    if(bitti.length>gos.length)h+='<button type="button" class="ekle" id="aj-tum">Tümünü göster</button>';
  }
  h+='</section>';
  h+='<section class="ablok"><h2>Rutin işler — ana liste</h2><p class="fine">Burada yapılan değişiklik bütün günlerin rutin iş listesine geçer. Değiştirdikten sonra “Listeyi kaydet”e basın.</p>';
  aj.rutinTaslak.forEach(function(r,i){
    h+='<div class="ajrt"><span class="sn">'+(i+1)+'</span><input type="text" class="ain" id="aj-rt-'+i+'" data-rt="'+i+'" maxlength="200" autocomplete="off" value="'+esc(r.metin)+'" aria-label="Rutin iş '+(i+1)+'">'+
       '<button type="button" class="sil" data-rtdel="'+i+'" aria-label="Rutin işi kaldır">&times;</button></div>';
  });
  h+='<div class="akbtn"><button type="button" class="ekle" id="aj-rt-ekle">+ Rutin iş ekle</button>'+
     '<button type="button" class="btn primary" id="aj-rt-kaydet"'+(aj.rtKirli?'':' disabled')+'>Listeyi kaydet</button></div></section>';
  return h;
}

/* ---------- görevler ve rutin ana liste ---------- */
function ajGorevBul(id){for(var i=0;i<aj.gorevler.length;i++)if(aj.gorevler[i].id===id)return aj.gorevler[i];return null;}
function ajGorevEkle(){
  var inp=$('aj-gorev-metin'),btn=$('aj-gorev-ekle'),m=inp.value.replace(/\s+/g,' ').trim(),dep=aj.dep;
  if(!m){inp.focus();return;}
  btn.disabled=true;
  sb.from('ajanda_gorev').insert({departman:dep,metin:m.slice(0,300)}).select().single().then(function(r){
    if(r.error){btn.disabled=false;toast(ajHata(r.error));return;}
    if(aj.dep!==dep)return;
    aj.gorevler=aj.gorevler.concat([r.data]);ajCiz();toast('Görev eklendi.');
    var y=$('aj-gorev-metin');if(y)y.focus();
  }).catch(function(e){btn.disabled=false;toast(ajHata(e));});
}
function ajGorevGuncelle(id,alan,tamam){
  var g=ajGorevBul(id);if(!g)return;
  sb.from('ajanda_gorev').update(alan).eq('id',id).select().single().then(function(r){
    if(r.error){toast(ajHata(r.error));ajCiz();return;}
    Object.assign(g,r.data);
    if(tamam)tamam();
  }).catch(function(e){toast(ajHata(e));ajCiz();});
}
function ajGorevSil(id){
  var g=ajGorevBul(id);if(!g)return;
  if(!window.confirm('“'+g.metin+'” görevi silinsin mi?'))return;
  sb.from('ajanda_gorev').delete().eq('id',id).then(function(r){
    if(r.error){toast(ajHata(r.error));return;}
    aj.gorevler=aj.gorevler.filter(function(x){return x.id!==id;});ajCiz();toast('Görev silindi.');
  }).catch(function(e){toast(ajHata(e));});
}
function ajRutinKaydet(){
  var dep=aj.dep,btn=$('aj-rt-kaydet'),liste=[];
  aj.rutinTaslak.forEach(function(r){var m=String(r.metin||'').replace(/\s+/g,' ').trim().slice(0,200);if(m)liste.push({id:r.id,metin:m});});
  btn.disabled=true;btn.textContent='Kaydediliyor…';
  sb.from('ajanda_rutin').upsert({departman:dep,liste:liste},{onConflict:'departman'}).then(function(r){
    if(r.error){btn.disabled=false;btn.textContent='Listeyi kaydet';toast(ajHata(r.error));return;}
    if(aj.dep!==dep)return;
    aj.rutin=liste;aj.rutinTaslak=clone(liste);aj.rtKirli=false;ajCiz();toast('Rutin işler listesi kaydedildi.');
  }).catch(function(e){btn.disabled=false;btn.textContent='Listeyi kaydet';toast(ajHata(e));});
}

/* ---------- olaylar ---------- */
$('aj').addEventListener('input',function(ev){
  var t=ev.target;if(!aj.gun)return;
  if(t.id==='aj-odak'){aj.gun.odak=t.value;ajDegisti();}
  else if(t.id==='aj-not'){aj.gun.notlar=t.value;ajDegisti();}
  else if(t.hasAttribute('data-is')){
    var i=+t.getAttribute('data-is');
    while(aj.gun.isler.length<=i)aj.gun.isler.push('');
    aj.gun.isler[i]=t.value;ajDegisti();
  }else if(t.hasAttribute('data-rt')){
    aj.rutinTaslak[+t.getAttribute('data-rt')].metin=t.value;
    if(!aj.rtKirli){aj.rtKirli=true;var b=$('aj-rt-kaydet');if(b)b.disabled=false;}
  }
});
$('aj').addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='aj-tarih'){
    if(/^\d{4}-\d{2}-\d{2}$/.test(t.value))ajGit(aj.dep,t.value);else t.value=aj.tarih;
  }else if(t.hasAttribute('data-gorev')){
    var id=t.getAttribute('data-gorev'),g=ajGorevBul(id),m=t.value.replace(/\s+/g,' ').trim();
    if(!g)return;
    if(!m){t.value=g.metin;toast('Görev metni boş bırakılamaz.');return;}
    if(m!==g.metin)ajGorevGuncelle(id,{metin:m.slice(0,300)},function(){toast('Görev güncellendi.');});
  }else if(t.id==='aj-odak'||t.id==='aj-not'||t.hasAttribute('data-is')){
    if(aj.kirli)ajKaydet();
  }
});
$('aj').addEventListener('submit',function(ev){ev.preventDefault();if(ev.target.id==='aj-gorev-yeni')ajGorevEkle();});
$('aj').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-ajdep')){var d=b.getAttribute('data-ajdep');if(d!==aj.dep)ajGit(d,aj.tarih);return;}
  if(b.hasAttribute('data-ajsekme')){
    var s=b.getAttribute('data-ajsekme');if(s===aj.sekme)return;
    if(aj.kirli)ajKaydet();
    aj.sekme=s;ajCiz();return;
  }
  if(b.id==='aj-once'){ajGunKaydir(-1);return;}
  if(b.id==='aj-sonra'){ajGunKaydir(1);return;}
  if(b.id==='aj-bugun'){ajGit(aj.dep,todayStr());return;}
  if(!aj.gun)return;
  if(b.id==='aj-is-ekle'){
    var n=Math.max(aj.satir,aj.gun.isler.length,10)+1;aj.satir=n;ajCiz();
    var y=$('aj-is-'+(n-1));if(y)y.focus();return;
  }
  if(b.hasAttribute('data-rutin')){
    var id=b.getAttribute('data-rutin'),ok=!aj.gun.rutin[id],row=b.closest('.ajr');
    if(ok)aj.gun.rutin[id]=true;else delete aj.gun.rutin[id];
    row.className='ajr '+(ok?'yapildi':'yapilmadi');b.setAttribute('aria-pressed',ok);b.textContent=ok?'✓ Yapıldı':'✗ Yapılmadı';
    var sy=$('aj-rsay');if(sy)sy.textContent=aj.rutin.filter(function(r){return aj.gun.rutin[r.id];}).length+' / '+aj.rutin.length+' yapıldı';
    ajDegisti(true);return;
  }
  if(b.hasAttribute('data-gorev-durum')){
    var gid=b.getAttribute('data-gorev-durum'),g=ajGorevBul(gid);if(!g)return;
    b.disabled=true;
    ajGorevGuncelle(gid,{yapildi:!g.yapildi},function(){ajCiz();toast(g.yapildi?'Görev yapıldı olarak işaretlendi.':'Görev yapılmadı olarak işaretlendi.');});return;
  }
  if(b.hasAttribute('data-gorev-sil')){ajGorevSil(b.getAttribute('data-gorev-sil'));return;}
  if(b.id==='aj-tum'){aj.tumYapilan=true;ajCiz();return;}
  if(b.id==='aj-rt-ekle'){
    aj.rutinTaslak.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),metin:''});aj.rtKirli=true;ajCiz();
    var yr=$('aj-rt-'+(aj.rutinTaslak.length-1));if(yr)yr.focus();return;
  }
  if(b.hasAttribute('data-rtdel')){aj.rutinTaslak.splice(+b.getAttribute('data-rtdel'),1);aj.rtKirli=true;ajCiz();return;}
  if(b.id==='aj-rt-kaydet'){ajRutinKaydet();return;}
});
/* Sekme arka plana geçerken bekleyen değişiklik kaydedilir; geri gelince başkasının yazdıkları okunur */
document.addEventListener('visibilitychange',function(){
  if(st.view!=='ajanda'||st.oturum!=='ok')return;
  if(document.hidden){if(aj.kirli)ajKaydet();}
  else if(aj.dep&&aj.gun&&!aj.kirli)ajYukle(true);
});
window.addEventListener('pagehide',function(){if(aj.kirli)ajKaydet();if(ks.kirli)ksKaydet();});
document.addEventListener('visibilitychange',function(){
  if(st.view!=='kasa'||st.oturum!=='ok')return;
  if(document.hidden){if(ks.kirli)ksKaydet();}
  else if(ks.yuklu&&ks.gun&&!ks.kirli&&!ks.tKirli)ksYukle(true);
});

/* ---------- geçmiş tarihler ----------
   Takvim, programın kullanılmaya başlandığı aydan (Ekim 2026) başlar; öncesi kimseye gösterilmez.
   Geçmiş güne yeni sözleşme yazılmaz. Yönetici dışındaki kullanıcılar geçmiş günleri ve ayları da görmez. */
var BASLANGIC_AY='2026-10';
function gecmis(t){return t<todayStr();}
function enErkenAy(){var b=todayStr().slice(0,7);return st.admin||b<BASLANGIC_AY?BASLANGIC_AY:b;}

/* ---------- menü detayı ----------
   Sözleşmede boş bırakılan alan, seçili menünün Ayarlar'daki içeriğiyle tamamlanır
   (eski kayıtlarda yalnızca menü adı yazılı olsa da detaylar görünür). */
var MENU_ALAN=[['baslangic','f-baslangic'],['araSicak','f-arasicak'],['anaYemek','f-anayemek'],['meyve','f-meyve'],['tatli','f-tatli'],['ikram','f-ikram']];
function menuDetay(menu,dt){
  var def=menuOf(menu)||{},o={};
  dt=dt||{};
  MENU_ALAN.forEach(function(a){
    var k=a[0],v=String(dt[k]==null?'':dt[k]).trim();
    if(!v||(k==='anaYemek'&&v===menu))v=def[k]||v;
    o[k]=v;
  });
  if(!o.anaYemek&&menu)o.anaYemek=menu;
  return o;
}

/* ---------- sözleşme iptali (yalnızca yönetici) ---------- */
function iptalKutu(ac){
  var k=$('f-iptal-kutu');if(!k)return;
  k.hidden=!ac;
  if(ac){try{k.scrollIntoView({block:'nearest'});}catch(e){}var n=$('f-iptal-neden');if(n)n.focus();}
}
function iptalEt(){
  if(!cur||!cur.rec||cur.busy||!sb||!st.admin)return;
  var c=cur,b=$('f-iptal-onay'),neden=$('f-iptal-neden').value.trim();
  c.busy=true;b.disabled=true;b.textContent='İptal ediliyor…';
  function geri(msg){c.busy=false;if($('f-iptal-onay')===b){b.disabled=false;b.textContent='Evet, sözleşmeyi iptal et';}fail(msg);}
  sb.rpc('sozlesme_iptal',{p_id:c.id,p_neden:neden}).then(function(r){
    if(r.error){
      var em=(r.error.code||'')+' '+(r.error.message||'');
      geri(/PGRST202|42883|sozlesme_iptal/.test(em)?'Veritabanı henüz güncellenmemiş: iptal işlevi eksik. Yöneticinize haber verin.':hataMetni(r.error));
      return;

/* ---------- opsiyon (süreli ön rezervasyon) ----------
   Opsiyon, sözleşme tablosunda durum = 'opsiyon' olan kayıttır. Bitiş günü sonuna kadar seansı tutar;
   süresi dolunca takvimde seans boş görünür ve yerine yeni kayıt yazılabilir (sunucu eski opsiyonu o anda siler).
   Zil: açık opsiyonların sayısını gösterir; bitişine 1 gün ya da daha az kalan opsiyon varsa kırmızı yanar. */
var ops=[];                       /* tüm yıllardaki opsiyonlar (süresi yeni dolanlar dahil) */
function opsMu(r){return !!r&&r.durum==='opsiyon';}
function opsGecerli(r){return opsMu(r)&&!!r.opsiyonBitis&&r.opsiyonBitis>=todayStr();}
function sozVar(id){var r=st.recs.get(id);return !!r&&!opsMu(r);}
function gunFark(a,b){return Math.round((toDate(b)-toDate(a))/86400000);}
function opsKalan(r){return gunFark(todayStr(),r.opsiyonBitis);}       /* 0: bugün bitiyor, 1: yarın, <0: doldu */
function opsYakin(r){var k=opsKalan(r);return k>=0&&k<=1;}
function opsKalanMetin(r){
  var k=opsKalan(r);
  return k<0?'Süresi doldu':k===0?'Bugün bitiyor':k===1?'Yarın bitiyor':k+' gün kaldı';
}
function opsBul(id){for(var i=0;i<ops.length;i++)if(ops[i].id===id)return ops[i];return null;}
function ileriGun(n){var d=toDate(todayStr());d.setDate(d.getDate()+n);return dateStr(d);}

var opsSira=0;
function opsYukle(){
  if(!sb||st.oturum!=='ok')return;
  var sira=++opsSira;
  sb.from('sozlesmeler').select('*').eq('durum','opsiyon').order('opsiyon_bitis').then(function(r){
    if(sira!==opsSira||st.oturum!=='ok')return;
    var yeni=[];
    if(!r.error)(r.data||[]).forEach(function(x){
      if(x&&x.musteri&&KOD[x.salon]&&SEANS_SABIT[x.seans]&&typeof x.tarih==='string'&&x.durum==='opsiyon'){var k=satirdanKayit(x);k.id=x.id;yeni.push(k);}
    });
    yeni.sort(function(a,b){return a.opsiyonBitis<b.opsiyonBitis?-1:a.opsiyonBitis>b.opsiyonBitis?1:a.tarih<b.tarih?-1:1;});
    ops=yeni;renderZil();
  }).catch(function(){});
}
function opsAcik(){return ops.filter(function(o){return opsGecerli(o)&&!gecmis(o.tarih);});}
function opsDolan(){var es=ileriGun(-7);return ops.filter(function(o){return !opsGecerli(o)&&o.opsiyonBitis>=es&&!gecmis(o.tarih);});}

function renderZil(){
  var b=$('zil');if(!b)return;
  var ac=opsAcik(),yakin=ac.filter(opsYakin).length;
  b.hidden=st.oturum!=='ok';
  b.className='nbtn zil'+(ac.length?' var':'')+(yakin?' uyari':'');
  $('zil-say').textContent=ac.length;
  var et=ac.length?(ac.length+' açık opsiyon'+(yakin?'; '+yakin+' tanesinin süresi dolmak üzere':'')):'Açık opsiyon yok';
  b.setAttribute('aria-label','Opsiyonlar: '+et);b.title=et;
}

function opsSatir(o,sinif){
  var sal=salonOf(o.salon),s=seansOf(o.seans);
  return '<li class="s-'+o.salon+(sinif?' '+sinif:'')+'"><button type="button" data-ops="'+esc(o.id)+'">'+
    '<b>'+esc(o.musteri)+'</b><span class="ob">'+opsKalanMetin(o)+'<br>'+fmtKisa(o.opsiyonBitis)+'</span>'+
    '<span class="ok2">'+esc(sal.ad)+' · '+fmtKisa(o.tarih)+' '+GUN_KISA[dow(o.tarih)]+' · '+esc(s.ad)+(o.telefon?' · '+esc(telGoster(o.telefon)):'')+'</span></button></li>';
}
function opsPanel(){
  cur=null;
  var ac=opsAcik(),yk=ac.filter(opsYakin),dg=ac.filter(function(o){return !opsYakin(o);}),dl=opsDolan();
  var h='<div class="dbody"><div class="dh"><div><p class="eyebrow">Opsiyon takibi</p><h2 id="dlg-title">'+(ac.length?ac.length+' açık opsiyon':'Açık opsiyon yok')+'</h2></div>'+
    '<button type="button" class="x" data-close aria-label="Kapat">&times;</button></div>';

  if(yk.length)h+='<p class="opbas">Süresi dolmak üzere</p><ul class="opl">'+yk.map(function(o){return opsSatir(o,'yakin');}).join('')+'</ul>';
  if(dg.length)h+='<p class="opbas">Açık opsiyonlar</p><ul class="opl">'+dg.map(function(o){return opsSatir(o,'');}).join('')+'</ul>';
  if(dl.length)h+='<p class="opbas">Son 7 günde süresi dolanlar · seans boşaldı</p><ul class="opl">'+dl.map(function(o){return opsSatir(o,'doldu');}).join('')+'</ul>';
  if(ac.length||dl.length)h+='<p class="fine">Satıra tıklayınca opsiyon açılır: süreyi uzatabilir, satışa dönüştürebilir ya da kaldırabilirsiniz.</p>';

function opsKaydet(){
  if(!cur||cur.tip!=='ops'||cur.busy||!sb)return;
  var c=cur,val=function(i){return $(i).value.trim();};
  $('f-err').hidden=true;
  var musteri=val('o-musteri'),tel=telDuzelt(val('o-telefon')),bitis=val('o-bitis'),kisi=parseN(val('o-kisi'));
  if(!musteri){fail('Müşteri adı soyadı boş bırakılamaz.');$('o-musteri').focus();return;}
  if(!tel){fail('Müşteri telefonu 10 haneli olmalı. Örnek: 535 123 45 67');$('o-telefon').focus();return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(bitis)){fail('Opsiyon bitiş tarihini seçin.');$('o-bitis').focus();return;}
  if(bitis<todayStr()){fail('Opsiyon bitiş tarihi bugünden önce olamaz.');$('o-bitis').focus();return;}
  if(bitis>c.tarih){fail('Opsiyon, organizasyon gününden ('+fmtKisa(c.tarih)+') sonra bitemez.');$('o-bitis').focus();return;}
  if(kisi!==null&&kisi<1){fail('Kişi sayısı en az 1 olmalı.');$('o-kisi').focus();return;}
  var alan={musteri:musteri,telefon:tel,kisi:kisi,notlar:val('o-not'),durum:'opsiyon',opsiyon_bitis:bitis};
  var btn=$('o-kaydet'),eski=btn.textContent,p;
  c.busy=true;btn.disabled=true;btn.textContent='Kaydediliyor…';
  function done(){c.busy=false;if($('o-kaydet')===btn){btn.disabled=false;btn.textContent=eski;}}
  if(c.mode==='new'){
    alan.id=c.id;alan.salon=c.salon;alan.tarih=c.tarih;alan.seans=c.seans;
    p=sb.from('sozlesmeler').insert(alan).select().single();
  }else p=sb.from('sozlesmeler').update(alan).eq('id',c.id).eq('durum','opsiyon').select().single();
  p.then(function(r){
    if(r.error){
      done();
      var em=(r.error.code||'')+' '+(r.error.message||'');
      if(c.mode==='new'&&r.error.code==='23505')fail('Bu seans az önce doldu; opsiyon konulamadı. Pencereyi kapatıp takvime bakın.');
      else if(/PGRST204|durum|opsiyon_bitis/.test(em)&&!/Opsiyon bitiş/.test(em))fail('Veritabanı henüz güncellenmemiş: opsiyon alanları eksik. Yöneticinize haber verin.');
      else if(r.error.code==='PGRST116')fail(c.mode==='new'?'Kayıt kabul edilmedi. Bu hesabın opsiyon koyma yetkisi olmayabilir.':'Opsiyon bulunamadı; kaldırılmış ya da yerine başka kayıt yazılmış olabilir.');
      else fail(/Opsiyon bitiş/.test(em)?r.error.message:hataMetni(r.error));
      if(c.mode==='new'&&r.error.code==='23505')yilYukle();
      return;
    }
    var k=satirdanKayit(r.data);
    putLocal(c.id,k);opsYukle();
    openOpsiyon(c.salon,c.tarih,c.seans);
    toast(c.mode==='new'?'Opsiyon konuldu. Seans '+fmtKisa(k.opsiyonBitis)+' gününe kadar tutuluyor.':'Opsiyon güncellendi.');
    var ok=$('f-ok');if(ok)ok.hidden=false;
  }).catch(function(err){done();fail(hataMetni(err));});
}

function opsSil(){
  if(!cur||cur.tip!=='ops'||!cur.rec||cur.busy||!sb)return;
  var c=cur,b=$('o-sil-onay');
  c.busy=true;b.disabled=true;b.textContent='Kaldırılıyor…';

  sb.from('sozlesmeler').delete().eq('id',c.id).eq('durum','opsiyon').then(function(r){
    if(r.error){geri(hataMetni(r.error));return;}

    ops=ops.filter(function(o){return o.id!==c.id;});
    hide();render();opsYukle();yilYukle();
    toast('Opsiyon kaldırıldı. Seans boşaldı.');
  }).catch(function(err){geri(hataMetni(err));});
}

/* ---------- telefon alanları ----------
   Kutunun başında sabit +90 durur; kutuya yalnızca rakam girer ve "535 668 79 80" biçimine kendiliğinden dizilir.
   Kayıtta "+90 535 668 79 80" olarak saklanır; eski kayıtlardaki "0535 668 79 80" de aynı biçimde gösterilir. */
function telRakam(v){
  var d=String(v==null?'':v).replace(/\D/g,'');
  d=d.replace(/^0+/,'');
  if(d.length>10&&d.slice(0,2)==='90')d=d.slice(2);
  d=d.replace(/^0+/,'');
  return d.slice(0,10);
}
function telBicim(d){return [d.slice(0,3),d.slice(3,6),d.slice(6,8),d.slice(8,10)].filter(Boolean).join(' ');}
function telYerel(v){return telBicim(telRakam(v));}
function telDuzelt(v){var d=telRakam(v);return d.length===10?'+90 '+telBicim(d):null;}
function telGoster(v){return telDuzelt(v)||String(v==null?'':v);}
function telSar(kok){
  [].forEach.call(kok.querySelectorAll('input[data-tel]'),function(i){
    if(i.parentNode.classList.contains('telw'))return;
    var w=document.createElement('div'),s=document.createElement('span');
    w.className='telw';s.textContent='+90';s.setAttribute('aria-hidden','true');
    i.parentNode.insertBefore(w,i);w.appendChild(s);w.appendChild(i);
    i.value=telYerel(i.value);i.placeholder='5xx xxx xx xx';i.maxLength=24;
  });
}
dlg.addEventListener('input',function(ev){
  var t=ev.target;if(!t||!t.hasAttribute||!t.hasAttribute('data-tel'))return;
  var once=t.value,yeni=telYerel(once);
  if(yeni===once)return;
  var pos=t.selectionStart,n=pos==null?10:telRakam(once.slice(0,pos)).length,i=0,k=0;
  t.value=yeni;
  /* imleç, önündeki rakam sayısı korunacak şekilde yerine konur */
  while(i<yeni.length&&k<n){if(/\d/.test(yeni.charAt(i)))k++;i++;}
  try{t.setSelectionRange(i,i);}catch(e){}
});

/* ---------- seçili süre düğmesi ---------- */
function ogunIsaretle(){
  var b=$('o-bitis');if(!b||!cur||cur.tip!=='ops')return;
  [].forEach.call(dlg.querySelectorAll('[data-ogun]'),function(d){
    var t=ileriGun(+d.getAttribute('data-ogun')),uygun=t<=cur.tarih,sec=uygun&&b.value===t;
    d.disabled=!uygun;d.classList.toggle('sec',sec);d.setAttribute('aria-pressed',sec?'true':'false');
  });
}

/* ---------- program aralığı ----------
   Takvim 1 Ekim 2026'da başlar ve Ayarlar'da yazılı yılın (varsayılan 2027) sonunda biter; dışındaki tarihler gösterilmez. */
var BASLANGIC_GUN=BASLANGIC_AY+'-01';
function enGecAy(){return cfg.sonYil+'-12';}
function enGecGun(){return cfg.sonYil+'-12-31';}
/* Yılın programa açık gün sayısı (2026 için 1 Ekim – 31 Aralık) ve ilk açık ayı (0 = Ocak) */
function yilIlkAy(y){return String(y)===BASLANGIC_AY.slice(0,4)?+BASLANGIC_AY.slice(5,7)-1:0;}
function yilAcikGun(y){return Math.round((new Date(y,11,31)-new Date(y,yilIlkAy(y),1))/86400000)+1;}

/* ---------- ay / yıl açılır listesi ---------- */
/* <select> veri kaynağı olarak yerinde durur; ekranda onun yerine düğme + liste gösterilir. */
var ddAcik=null;
function ddKapat(odak){
  if(!ddAcik)return;
  var w=ddAcik;ddAcik=null;
  w.querySelector('.ddl').hidden=true;
  var b=w.querySelector('.ddb');b.setAttribute('aria-expanded','false');
  if(odak)b.focus();
}
function ddAc(w){
  if(ddAcik===w)return;
  ddKapat(false);
  var l=w.querySelector('.ddl'),b=w.querySelector('.ddb');
  l.hidden=false;b.setAttribute('aria-expanded','true');ddAcik=w;
  var s=l.querySelector('.ddo[aria-selected="true"]:not(:disabled)')||l.querySelector('.ddo:not(:disabled)');
  if(s){s.focus({preventScroll:true});l.scrollTop=Math.max(0,s.offsetTop-l.clientHeight/2+s.offsetHeight/2);}
}
function ddCiz(sel){
  var w=sel.parentNode;
  if(!w.classList||!w.classList.contains('dd')){
    w=document.createElement('span');w.className='dd';
    sel.parentNode.insertBefore(w,sel);
    var b=document.createElement('button');b.type='button';b.className='ddb';
    b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
    var l=document.createElement('div');l.className='ddl';l.hidden=true;l.setAttribute('role','listbox');
    l.setAttribute('aria-label',sel.getAttribute('aria-label')||'');
    w.appendChild(b);w.appendChild(l);w.appendChild(sel);
    sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');
  }
  var dugme=w.querySelector('.ddb'),liste=w.querySelector('.ddl'),h='',i,o,sec=sel.options[sel.selectedIndex];
  w.hidden=sel.hidden;
  dugme.textContent=sec?sec.textContent:'';
  dugme.setAttribute('aria-label',(sel.getAttribute('aria-label')||'')+(sec?': '+sec.textContent:''));
  for(i=0;i<sel.options.length;i++){
    o=sel.options[i];
    h+='<button type="button" class="ddo" role="option" data-v="'+esc(o.value)+'" aria-selected="'+(i===sel.selectedIndex)+'"'+(o.disabled?' disabled':'')+'>'+esc(o.textContent)+'</button>';
  }
  if(liste.getAttribute('data-h')!==h){liste.innerHTML=h;liste.setAttribute('data-h',h);}
  if(w.hidden&&ddAcik===w)ddKapat(false);
}
document.addEventListener('click',function(ev){
  var t=ev.target,o=t.closest&&t.closest('.ddo'),b=t.closest&&t.closest('.ddb');
  if(o&&!o.disabled){
    var w=o.closest('.dd'),sel=w.querySelector('select'),v=o.getAttribute('data-v');
    ddKapat(true);
    if(sel.value!==v){sel.value=v;sel.dispatchEvent(new Event('change',{bubbles:true}));}
    return;
  }
  if(b){var kutu=b.parentNode;if(ddAcik===kutu)ddKapat(false);else ddAc(kutu);return;}
  if(ddAcik&&!(t.closest&&t.closest('.ddl')))ddKapat(false);
});
document.addEventListener('keydown',function(ev){
  var t=ev.target,k=ev.key;
  if(t.classList&&t.classList.contains('ddb')&&(k==='ArrowDown'||k==='ArrowUp')){ev.preventDefault();ddAc(t.parentNode);return;}
  if(!ddAcik)return;
  if(k==='Escape'){ev.preventDefault();ev.stopPropagation();ddKapat(true);return;}
  if(k==='Tab'){ddKapat(false);return;}
  if(!(t.classList&&t.classList.contains('ddo')))return;
  var a=[].slice.call(ddAcik.querySelectorAll('.ddo:not(:disabled)')),i=a.indexOf(t),n=-1;
  if(k==='ArrowDown')n=Math.min(a.length-1,i+1);
  else if(k==='ArrowUp')n=Math.max(0,i-1);
  else if(k==='Home')n=0;
  else if(k==='End')n=a.length-1;
  if(n>=0){ev.preventDefault();a[n].focus();}
},true);

/* Günlük kasa defteri: her gün bir sayfa. Üstte kasa özeti (devreden + gelir − çıkış = gün sonu; nakit / banka mevcudu),
   altında gelir ve gider tabloları, en altta akşam ve gündüz organizasyonlarının salon kartları (gelir, hizmet ödemeleri,
   tedarik, kâr). Excel'deki günlük kasa defterinin aynı kuralları: hizmet ödemeleri kasadan çıkar ve gider tablosuna
   kendiliğinden yazılır; tedarik cari borçtur, kasaya dokunmaz, yalnızca organizasyon kârına girer; nakit ↔ banka
   transferi gelir/gider değildir. Tutarlar kuruşlu tutulur. Yönetici dışındakiler yalnızca bugünün sayfasını değiştirir. */

    .map(function(a){return {ad:a[0],fiyat:a[1]};}),

};
function ksYeni(){return {sekme:'gun',tarih:null,ay:null,gun:null,meta:null,ayar:clone(KS_VARSAYILAN),ayarVar:false,taslak:null,tKirli:false,ozet:[],soz:[],durum:'',durumTur:'',hata:'',kirli:false,sira:0,yuklu:false};}

/* --- tutarlar: "1.018.873,16" biçimi; kuruş virgülden sonra --- */
function tlOku(s){
  s=String(s==null?'':s).replace(/[^\d.,]/g,'');
  if(!/\d/.test(s))return null;
  var iv=s.lastIndexOf(','),inn=s.lastIndexOf('.'),son=Math.max(iv,inn),tam=s,kr='';
  if(son>=0){
    var kuyruk=s.slice(son+1),adet=s.replace(/\d/g,'').length;
    /* son ayırıcıdan sonra 1–2 hane varsa kuruştur ("350,5", "1.250,00", "350.50"); 3 hane binliktir ("350.000", "350,000") */
    if(kuyruk.length>=1&&kuyruk.length<=2&&(s.charAt(son)===','||adet===1)){tam=s.slice(0,son);kr=kuyruk;}
  }
  tam=tam.replace(/\D/g,'');
  var n=parseInt(tam||'0',10)+(kr?parseInt((kr+'0').slice(0,2),10)/100:0);
  return Math.round(n*100)/100;
}
function tlYaz(n){
  if(n===null||n===undefined||n===''||isNaN(n))return '';
  var k=Math.round(Math.abs(n)*100),tam=Math.floor(k/100),kr=k%100;
  return (n<0&&k>0?'−':'')+fmtN(tam)+(kr?','+(kr<10?'0':'')+kr:'');
}
function tlPara(n){return (n===null||n===undefined||isNaN(n))?'—':tlYaz(n)+' ₺';}
function krs(n){return Math.round((Number(n)||0)*100);}
function sayiOku(s){var n=tlOku(s);return n===null?null:n;}

/* --- ayarlar (açılış bakiyesi, birim fiyatlar, gider türleri) --- */
function ksAyarTemiz(raw){
  var a=clone(KS_VARSAYILAN);
  if(!raw||typeof raw!=='object')return a;
  function liste(x,yedek){
    if(!Array.isArray(x))return yedek;
    var g={},o=[];
    x.forEach(function(k){
      if(!k||typeof k!=='object')return;
      var ad=String(k.ad==null?'':k.ad).replace(/\s+/g,' ').trim().slice(0,40),f=(typeof k.fiyat==='number'&&k.fiyat>=0)?Math.round(k.fiyat*100)/100:null;
      if(!ad||g[ad.toLocaleLowerCase('tr')])return;
      g[ad.toLocaleLowerCase('tr')]=1;o.push({ad:ad,fiyat:f});
    });
    return o;
  }
  a.personel=liste(raw.personel,a.personel);a.tedarik=liste(raw.tedarik,a.tedarik);
  if(Array.isArray(raw.giderTur)){
    var gt=[];raw.giderTur.forEach(function(t){t=String(t==null?'':t).replace(/\s+/g,' ').trim().slice(0,30);if(t&&gt.indexOf(t)<0)gt.push(t);});
    if(gt.length)a.giderTur=gt;
  }
  var ac=raw.acilis||{};
  a.acilis={tarih:/^\d{4}-\d{2}-\d{2}$/.test(ac.tarih||'')?ac.tarih:'',nakit:typeof ac.nakit==='number'?ac.nakit:null,banka:typeof ac.banka==='number'?ac.banka:null};
  return a;
}
function ksFiyat(liste,ad){
  var k=String(ad||'').toLocaleLowerCase('tr').trim(),i;
  if(!k)return null;
  for(i=0;i<liste.length;i++)if(liste[i].ad.toLocaleLowerCase('tr')===k)return liste[i].fiyat;
  return null;
}
/* Kasanın başladığı gün: ayarda yazılıysa o, yoksa ilk kayıtlı gün (o da yoksa bugün). */
function ksAcilisGun(){
  if(ks.ayar.acilis.tarih)return ks.ayar.acilis.tarih;
  return ks.ozet.length?ks.ozet[0].tarih:todayStr();
}

/* --- gün sayfası verisi --- */
function ksBosOrg(){return {ad:'',kisi:null,gelir:null,ekstra:null,hizmet:[],tedarik:[]};}
function ksGunTemiz(raw){
  raw=(raw&&typeof raw==='object')?raw:{};
  function yazi(x,n){return String(x==null?'':x).slice(0,n);}
  function sayi(x){return (typeof x==='number'&&isFinite(x))?Math.round(x*100)/100:null;}
  var v={gelir:[],gider:[],nb:sayi(raw.nb),bn:sayi(raw.bn),hk:{},org:{aksam:{},gunduz:{}}};
  (Array.isArray(raw.gelir)?raw.gelir:[]).forEach(function(r){if(r&&typeof r==='object')v.gelir.push({ac:yazi(r.ac,160),salon:salonOf(r.salon)?r.salon:'',kasa:r.kasa==='Nakit'||r.kasa==='Banka'?r.kasa:'',tutar:sayi(r.tutar)});});
  (Array.isArray(raw.gider)?raw.gider:[]).forEach(function(r){if(r&&typeof r==='object')v.gider.push({ac:yazi(r.ac,160),tur:yazi(r.tur,30),kasa:r.kasa==='Nakit'||r.kasa==='Banka'?r.kasa:'',tutar:sayi(r.tutar)});});
  salonlar().forEach(function(s){v.hk[s.id]=(raw.hk&&raw.hk[s.id]==='Banka')?'Banka':'Nakit';});
  KS_BANT.forEach(function(b){
    var kaynak=(raw.org&&raw.org[b[0]])||{};
    salonlar().forEach(function(s){
      var o=kaynak[s.id]||{},y=ksBosOrg();
      y.ad=yazi(o.ad,120);y.kisi=sayi(o.kisi);y.gelir=sayi(o.gelir);y.ekstra=sayi(o.ekstra);
      (Array.isArray(o.hizmet)?o.hizmet:[]).forEach(function(h){if(h&&typeof h==='object')y.hizmet.push({ad:yazi(h.ad,40),kisi:sayi(h.kisi),tutar:sayi(h.tutar),el:!!h.el});});
      (Array.isArray(o.tedarik)?o.tedarik:[]).forEach(function(t){if(t&&typeof t==='object')y.tedarik.push({ad:yazi(t.ad,60),miktar:sayi(t.miktar),tutar:sayi(t.tutar),el:!!t.el});});
      v.org[b[0]][s.id]=y;
    });
  });
  return v;
}
/* Ekranda her zaman dolacak boş satırlar bulunur; kayıtta boşlar atılır. */
function ksSatirDoldur(v){
  while(v.gelir.length<6)v.gelir.push({ac:'',salon:'',kasa:'',tutar:null});
  while(v.gider.length<8)v.gider.push({ac:'',tur:'',kasa:'',tutar:null});
  KS_BANT.forEach(function(b){
    salonlar().forEach(function(s){
      var o=v.org[b[0]][s.id],sirali=[];
      /* standart kadro satırları her kartta hazır durur (Kına Ekibi yalnızca Kına Konağı'nda); listede olmayanlar sona eklenir */
      ks.ayar.personel.forEach(function(p){
        var k=p.ad.toLocaleLowerCase('tr'),bul=null;
        o.hizmet.forEach(function(h){if(!bul&&h.ad.toLocaleLowerCase('tr').trim()===k)bul=h;});
        if(!bul&&k==='kına ekibi'&&s.id!=='cadir')return;
        sirali.push(bul||{ad:p.ad,kisi:null,tutar:null,el:false});
      });
      o.hizmet.forEach(function(h){if(sirali.indexOf(h)<0)sirali.push(h);});
      o.hizmet=sirali;
      while(o.tedarik.length<4)o.tedarik.push({ad:'',miktar:null,tutar:null,el:false});
    });
  });
  return v;
}
function ksOrgDolu(o){
  return !!(o.ad.trim()||o.kisi||o.gelir||o.ekstra||o.hizmet.some(function(h){return h.kisi||h.tutar;})||o.tedarik.some(function(t){return t.ad.trim()||t.miktar||t.tutar;}));
}
function ksGunSade(v){
  var o={gelir:[],gider:[],nb:v.nb||null,bn:v.bn||null,hk:{},org:{aksam:{},gunduz:{}}};
  v.gelir.forEach(function(r){if(r.ac.trim()||r.tutar||r.salon)o.gelir.push({ac:r.ac.trim(),salon:r.salon,kasa:r.kasa,tutar:r.tutar});});
  v.gider.forEach(function(r){if(r.ac.trim()||r.tutar||r.tur)o.gider.push({ac:r.ac.trim(),tur:r.tur,kasa:r.kasa,tutar:r.tutar});});
  Object.keys(v.hk).forEach(function(k){if(v.hk[k]==='Banka')o.hk[k]='Banka';});
  KS_BANT.forEach(function(b){
    Object.keys(v.org[b[0]]).forEach(function(sid){
      var x=v.org[b[0]][sid];
      if(!ksOrgDolu(x))return;
      o.org[b[0]][sid]={ad:x.ad.trim(),kisi:x.kisi,gelir:x.gelir,ekstra:x.ekstra,
        hizmet:x.hizmet.filter(function(h){return h.kisi||h.tutar;}).map(function(h){return {ad:h.ad.trim(),kisi:h.kisi,tutar:h.tutar,el:!!h.el};}),
        tedarik:x.tedarik.filter(function(t){return t.ad.trim()||t.miktar||t.tutar;}).map(function(t){return {ad:t.ad.trim(),miktar:t.miktar,tutar:t.tutar,el:!!t.el};})};
    });
  });
  return o;
}

/* --- hesap (kuruş üzerinden) --- */
function ksOrgHesap(o){
  var h=0,t=0;
  o.hizmet.forEach(function(x){h+=krs(x.tutar);});
  o.tedarik.forEach(function(x){t+=krs(x.tutar);});
  var g=krs(o.gelir)+krs(o.ekstra),kar=g-h-t;
  return {gelir:g/100,hizmet:h/100,tedarik:t/100,kar:kar/100,marj:g?kar/g:null,kisiBasi:o.kisi?((h+t)/100)/o.kisi:null,hizmetKisi:o.hizmet.reduce(function(a,x){return a+(x.kisi||0);},0)};
}
function ksHesap(v){
  var G=0,GN=0,GB=0,C=0,CN=0,CB=0,T=0,hiz={},kasasiz=0;
  v.gelir.forEach(function(r){var k=krs(r.tutar);G+=k;if(r.kasa==='Nakit')GN+=k;else if(r.kasa==='Banka')GB+=k;else if(k)kasasiz++;});
  v.gider.forEach(function(r){var k=krs(r.tutar);C+=k;if(r.kasa==='Nakit')CN+=k;else if(r.kasa==='Banka')CB+=k;else if(k)kasasiz++;});
  salonlar().forEach(function(s){
    var top=0;
    KS_BANT.forEach(function(b){var o=v.org[b[0]][s.id];if(!o)return;var x=ksOrgHesap(o);top+=krs(x.hizmet);T+=krs(x.tedarik);});
    hiz[s.id]=top/100;C+=top;
    if(v.hk[s.id]==='Banka')CB+=top;else CN+=top;
  });
  var nb=krs(v.nb),bn=krs(v.bn);
  return {gelir:G/100,gider:C/100,nakit:(GN-CN-nb+bn)/100,banka:(GB-CB+nb-bn)/100,tedarik:T/100,hizmet:hiz,kasasiz:kasasiz};
}
/* Bir günün sabahındaki devreden tutarlar: açılış + o günden önceki bütün günlerin hareketi. */
function ksDevir(tarih){
  var ac=ks.ayar.acilis,bas=ksAcilisGun(),n=krs(ac.nakit),b=krs(ac.banka),t=n+b;
  /* toplam kasa gelir − gider ile, nakit ve banka kendi hareketleriyle ayrı ayrı devreder; ikisi tutmuyorsa kasa kontrolü uyarır */
  ks.ozet.forEach(function(g){if(g.tarih>=bas&&g.tarih<tarih){n+=krs(g.nakit);b+=krs(g.banka);t+=krs(g.gelir)-krs(g.gider);}});
  return {nakit:n/100,banka:b/100,toplam:t/100};
}
function ksOzetYerles(tarih,h){
  var i,yeni={tarih:tarih,gelir:h.gelir,gider:h.gider,nakit:h.nakit,banka:h.banka,tedarik:h.tedarik};
  for(i=0;i<ks.ozet.length;i++)if(ks.ozet[i].tarih===tarih){ks.ozet[i]=yeni;return;}
  ks.ozet.push(yeni);ks.ozet.sort(function(a,b){return a.tarih<b.tarih?-1:1;});
}

/* --- durum, yükleme, kayıt --- */
function ksHata(e){
  var c=(e&&e.code)||'',m=(e&&e.message)||'';
  if(c==='42P01'||c==='42703'||c==='PGRST205'||c==='PGRST204'||/kasa_/.test(m)&&/does not exist|schema cache|could not find/i.test(m))
    return 'Kasa için veritabanı eklemesi henüz yapılmamış. Yöneticinize haber verin.';
  if(/Yalnızca bugünün/.test(m))return m;
  return hataMetni(e);
}
function ksDurum(t,tur){
  ks.durum=t||'';ks.durumTur=tur||'';
  var el=$('ks-durum');if(el){el.textContent=ks.durum;el.className='ajdurum'+(ks.durumTur?' '+ks.durumTur:'');}
}
function ksOdakta(){var a=document.activeElement,k=$('ks');return !!(a&&k&&k.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));}
function ksYukle(sessiz){
  if(!sb||!ksErisim())return;
  var tarih=ks.tarih,sira=++ks.sira;
  if(!sessiz){ks.gun=null;ks.hata='';ks.durum='';ks.durumTur='';ksCiz();}
  Promise.all([
    sb.from('kasa_ayar').select('veri').eq('id','genel').maybeSingle(),
    sb.from('kasa_gun').select('tarih,gelir,gider,nakit,banka,tedarik').order('tarih'),
    sb.from('kasa_gun').select('*').eq('tarih',tarih).maybeSingle(),
    sb.from('sozlesmeler').select('salon,seans,musteri,kisi,bedel,durum').eq('tarih',tarih)
  ]).then(function(r){
    if(sira!==ks.sira)return;
    var e=r[0].error||r[1].error||r[2].error;
    if(e){if(sessiz)return;ks.hata=ksHata(e);ks.gun=null;ksCiz();return;}
    if(sessiz&&(ks.kirli||ks.tKirli||ksOdakta()))return;
    ks.ayarVar=!!(r[0].data&&r[0].data.veri);
    ks.ayar=ksAyarTemiz(r[0].data&&r[0].data.veri);
    if(!ks.tKirli)ks.taslak=clone(ks.ayar);
    ks.ozet=(r[1].data||[]).map(function(g){return {tarih:g.tarih,gelir:+g.gelir||0,gider:+g.gider||0,nakit:+g.nakit||0,banka:+g.banka||0,tedarik:+g.tedarik||0};});
    ks.ozet.sort(function(a,b){return a.tarih<b.tarih?-1:(a.tarih>b.tarih?1:0);});
    ks.soz=(r[3].data||[]).filter(function(x){return x.durum!=='opsiyon';});
    var x=r[2].data,v=ksGunTemiz(x&&x.veri);
    /* Yeni açılan sayfada takvimdeki sözleşmeler salon kartlarına hazır gelir. */
    if(!x)ks.soz.forEach(function(s){var o=v.org[s.seans]&&v.org[s.seans][s.salon];if(o){o.ad=s.musteri||'';o.kisi=s.kisi||null;}});
    ks.gun=ksSatirDoldur(v);
    ks.meta=x?{guncelleyen:x.guncelleyen||null,guncelleme:x.guncelleme||null}:null;
    ks.hata='';ks.yuklu=true;
    ksCiz();
  }).catch(function(e){if(sira!==ks.sira||sessiz)return;ks.hata=ksHata(e);ks.gun=null;ksCiz();});

function ksDegisti(hemen){

function ksKalan(tarih,e){
  ks.kirli=true;
  if(ks.tarih===tarih)ksDurum('Kaydedilemedi: '+ksHata(e)+(/Yalnızca bugünün|yetkiniz yok/.test(ksHata(e))?'':' Yeniden denenecek.'),'bad');
  clearTimeout(ksT);
  if(!/Yalnızca bugünün|yetkiniz yok/.test(ksHata(e)))ksT=setTimeout(ksKaydet,5000);
}
function ksKaydet(){
  clearTimeout(ksT);ksT=null;
  if(!ks.kirli||!sb||!ks.gun||!ks.tarih)return Promise.resolve();
  var tarih=ks.tarih,h=ksHesap(ks.gun);
  var satir={tarih:tarih,veri:ksGunSade(ks.gun),gelir:h.gelir,gider:h.gider,nakit:h.nakit,banka:h.banka,tedarik:h.tedarik};
  ks.kirli=false;
  return sb.from('kasa_gun').upsert(satir,{onConflict:'tarih'}).then(function(r){
    if(r.error){ksKalan(tarih,r.error);return;}
    ksOzetYerles(tarih,h);
    if(ks.tarih===tarih){
      ks.meta={guncelleyen:benId,guncelleme:new Date().toISOString()};
      if(!ks.kirli)ksDurum('✓ Kaydedildi · '+ajSaat(),'ok');
      var m=$('ks-meta');if(m)m.textContent=ksMeta();
    }
  }).catch(function(e){ksKalan(tarih,e);});
}
function ksGit(tarih){
  var p=ks.kirli?ksKaydet():Promise.resolve();
  Promise.resolve(p).then(function(){
    if(ks.kirli)return;
    if(tarih<BASLANGIC_GUN)tarih=BASLANGIC_GUN;
    if(tarih>enGecGun())tarih=enGecGun();
    ks.tarih=tarih;ks.ay=tarih.slice(0,7);ksYukle();
  });
}

/* Hesaplanan bütün rakamları ekrana yazar (kutulara dokunmaz, imleç yerinde kalır). */
function ksOzetYaz(){
  var v=ks.gun;if(!v)return;
  var h=ksHesap(v),dv=ksDevir(ks.tarih),son=krs(dv.toplam)+krs(h.gelir)-krs(h.gider),nk=krs(dv.nakit)+krs(h.nakit),bk=krs(dv.banka)+krs(h.banka),fark=nk+bk-son;
  function yaz(k,t){var a=document.querySelectorAll('#ks [data-o="'+k+'"]'),i;for(i=0;i<a.length;i++)a[i].textContent=t;}
  yaz('devir',tlPara(dv.toplam));yaz('gelir',tlPara(h.gelir));yaz('gider',tlPara(h.gider));yaz('son',tlPara(son/100));
  yaz('nakit',tlPara(nk/100));yaz('banka',tlPara(bk/100));yaz('tedarik',tlPara(h.tedarik));
  var kn=$('ks-kontrol');
  if(kn){
    if(Math.abs(fark)<50){kn.className='kskontrol ok';kn.textContent='✓ Kasa kontrolü: nakit + banka = gün sonu kasa';}
    else{kn.className='kskontrol bad';kn.textContent='⚠ Kasa farkı: '+tlPara(fark/100)+' — '+(h.kasasiz?h.kasasiz+' satırda “Kasa” (nakit / banka) seçilmemiş':'nakit ve banka toplamı gün sonu kasayı tutmuyor');}
  }
  salonlar().forEach(function(s){
    yaz('hiz-'+s.id,h.hizmet[s.id]?tlPara(h.hizmet[s.id]):'—');
    var satir=document.querySelector('#ks .ksr.oto[data-hk="'+s.id+'"]');if(satir)satir.hidden=!h.hizmet[s.id];
    KS_BANT.forEach(function(b){
      var o=v.org[b[0]][s.id],x=ksOrgHesap(o),k=b[0]+'-'+s.id;
      yaz('og-'+k,tlPara(x.gelir));yaz('oh-'+k,tlPara(x.hizmet));yaz('ot-'+k,tlPara(x.tedarik));yaz('ok-'+k,tlPara(x.kar));
      yaz('om-'+k,x.marj===null?'—':yuzde(x.marj));yaz('op-'+k,x.kisiBasi===null?'—':tlPara(Math.round(x.kisiBasi*100)/100));
      yaz('oad-'+k,o.ad.trim()||(ksOrgDolu(o)?'(adsız)':'Organizasyon yok'));
      yaz('okar-'+k,ksOrgDolu(o)&&(x.gelir||x.hizmet||x.tedarik)?'Kâr '+tlPara(x.kar):'');
      var kart=document.querySelector('#ks .kskart[data-bant="'+b[0]+'"][data-salon="'+s.id+'"]');
      if(kart){kart.classList.toggle('dolu',ksOrgDolu(o));kart.classList.toggle('zarar',x.kar<0);}
    });
  });
  /* kasası seçilmemiş tutarlı satırlar işaretlenir */
  [['gl',v.gelir],['gd',v.gider]].forEach(function(p){
    p[1].forEach(function(r,i){var el=document.querySelector('#ks [data-'+p[0]+'="'+i+'"]');if(el)el.classList.toggle('eksik',!!r.tutar&&!r.kasa);});
  });
}

  var onceki=ymd(m===1?y-1:y,m===1?12:m-1,1).slice(0,7),sonraki=ymd(m===12?y+1:y,m===12?1:m+1,1).slice(0,7);
  var harita={};ks.ozet.forEach(function(g){harita[g.tarih]=g;});
  var dv=ksDevir(ym+'-01'),n=krs(dv.nakit),b=krs(dv.banka),top=krs(dv.toplam),G=0,C=0,T=0,satir='';
  for(i=1;i<=gunSay;i++){
    var t=ymd(y,m,i),g=harita[t],once=t<bas,gel=g&&!once?krs(g.gelir):0,gid=g&&!once?krs(g.gider):0,devir=top;
    if(g&&!once){n+=krs(g.nakit);b+=krs(g.banka);T+=krs(g.tedarik);}
    G+=gel;C+=gid;
    var son=devir+gel-gid,fark=n+b-son,w=dow(t);top=son;
    satir+='<tr class="'+(isYogun(w)?'we ':'')+(t===bugun?'bugun ':'')+(once||t>bugun?'soluk':'')+'"><td><button type="button" class="who" data-ksgun="'+t+'">'+pad(i)+' '+GUN_KISA[w]+'</button></td>'+
      '<td class="num">'+(once?'—':tlYaz(devir/100))+'</td><td class="num">'+(gel?tlYaz(gel/100):'—')+'</td><td class="num">'+(gid?tlYaz(gid/100):'—')+'</td>'+
      '<td class="num guclu">'+(once?'—':tlYaz(son/100))+'</td><td class="num">'+(once?'—':tlYaz(n/100))+'</td><td class="num">'+(once?'—':tlYaz(b/100))+'</td>'+
      '<td>'+(once||t>bugun?'':Math.abs(fark)>=50?'<span class="kbad">⚠ '+tlYaz(fark/100)+' ₺ fark</span>':(g?'<span class="kok">✓</span>':''))+'</td></tr>';
  }
  h+='<div class="ajnav"><button type="button" class="nbtn arrow" id="ks-ay-once" aria-label="Önceki ay"'+(onceki<BASLANGIC_AY?' disabled':'')+'>&#8249;</button>'+
     '<span class="ajgun">'+AYLAR[m-1]+' '+y+'</span>'+
     '<button type="button" class="nbtn arrow" id="ks-ay-sonra" aria-label="Sonraki ay"'+(sonraki>enGecAy()?' disabled':'')+'>&#8250;</button></div>';
  h+='<div class="tiles"><div class="tile"><span class="tl">Ay geliri</span><span class="tv">'+tlPara(G/100)+'</span></div>'+
     '<div class="tile"><span class="tl">Ay gideri</span><span class="tv">'+tlPara(C/100)+'</span></div>'+
     '<div class="tile"><span class="tl">Ay sonu kasa (net)</span><span class="tv">'+tlPara(top/100)+'</span></div>'+
     '<div class="tile"><span class="tl">Ay sonu nakit</span><span class="tv">'+tlPara(n/100)+'</span></div>'+
     '<div class="tile"><span class="tl">Ay sonu banka</span><span class="tv">'+tlPara(b/100)+'</span></div>'+
     '<div class="tile"><span class="tl">Ay tedariki · cari borç</span><span class="tv">'+tlPara(T/100)+'</span></div></div>';
  h+='<div class="scroll"><table class="liste ksay"><thead><tr><th>Gün</th><th class="num">Devir</th><th class="num">Gelir</th><th class="num">Gider</th><th class="num">Gün sonu kasa</th><th class="num">Nakit</th><th class="num">Banka</th><th>Kontrol</th></tr></thead><tbody>'+satir+'</tbody></table></div>'+
     '<p class="fine">Güne tıklayınca o günün sayfası açılır. Kasa '+(ks.ayar.acilis.tarih?fmtKisa(bas)+' tarihinde '+tlPara((krs(ks.ayar.acilis.nakit)+krs(ks.ayar.acilis.banka))/100)+' ile açıldı (nakit '+tlPara(ks.ayar.acilis.nakit||0)+', banka '+tlPara(ks.ayar.acilis.banka||0)+').':'açılışı henüz girilmedi.')+'</p>';
  return h;
}

/* --- kasa ayarları (yalnızca yönetici) --- */
function ksAyarHtml(){
  var t=ks.taslak||(ks.taslak=clone(ks.ayar)),h='';
  h+='<section class="ablok"><h2>Kasa açılışı</h2><p class="fine">Kasanın programda başladığı günün sabahındaki tutarlar. Bu tarihten önceki günler hesaba girmez; sonraki her gün kendiliğinden devreder.</p>'+
     '<div class="ksuc"><div class="fld"><label for="ks-ac-tarih">Açılış tarihi</label><input type="date" class="ain" id="ks-ac-tarih" data-ka="tarih" value="'+esc(t.acilis.tarih||'')+'" min="'+BASLANGIC_GUN+'" max="'+enGecGun()+'"></div>'+
     '<div class="fld"><label for="ks-ac-nakit">Nakit açılış (kasa sayımı)</label>'+ksTl('ks-ac-nakit',t.acilis.nakit,' data-ka="nakit"')+'</div>'+
     '<div class="fld"><label for="ks-ac-banka">Banka açılış (hesap bakiyesi)</label>'+ksTl('ks-ac-banka',t.acilis.banka,' data-ka="banka"')+'</div></div>'+
     '<p class="fine">Toplam devir: <b id="ks-ac-top">'+tlPara((krs(t.acilis.nakit)+krs(t.acilis.banka))/100)+'</b></p></section>';
  [['personel','Personel birim fiyatları (yevmiye)','Salon kartlarındaki hizmet ödemelerinde kişi sayısı yazılınca tutar bu fiyatla hesaplanır. Fiyatı boş bırakılanın tutarı elle yazılır.','Kişi başı ₺'],
   ['tedarik','Tedarik birim fiyatları','Tedarik satırında miktar yazılınca tutar bu fiyatla hesaplanır.','Birim ₺']].forEach(function(L){
    h+='<section class="ablok"><h2>'+L[1]+'</h2><p class="fine">'+L[2]+'</p><div class="kst iki"><div class="ksr h"><span>Ad</span><span>'+L[3]+'</span><span></span></div>';
    t[L[0]].forEach(function(k,i){
      h+='<div class="ksr" data-kb="'+L[0]+'" data-i="'+i+'"><input type="text" class="ain" id="ks-'+L[0]+'-ad-'+i+'" data-f="ad" maxlength="40" autocomplete="off" value="'+esc(k.ad)+'" aria-label="Ad">'+
         ksTl('ks-'+L[0]+'-fiyat-'+i,k.fiyat,' data-f="fiyat" aria-label="Birim fiyat"')+'<button type="button" class="sil" data-kbdel aria-label="Satırı kaldır">&times;</button></div>';
    });
    h+='</div><button type="button" class="ekle" data-kbekle="'+L[0]+'">+ Satır ekle</button></section>';
  });
  h+='<section class="ablok"><h2>Gider türleri</h2><p class="fine">Gider tablosundaki “Türü” listesinde çıkar.</p><div class="ksturler">';
  t.giderTur.forEach(function(x,i){h+='<div class="ksr2"><input type="text" class="ain" id="ks-tur-'+i+'" data-gt="'+i+'" maxlength="30" autocomplete="off" value="'+esc(x)+'" aria-label="Gider türü"><button type="button" class="sil" data-gtdel="'+i+'" aria-label="Türü kaldır">&times;</button></div>';});
  h+='</div><button type="button" class="ekle" id="ks-tur-ekle">+ Tür ekle</button></section>';
  h+='<div class="ksfoot"><span class="fine" id="ks-ayar-durum">'+(ks.tKirli?'Kaydedilmemiş değişiklikler var.':'Kasa ayarları kayıtlı.')+'</span><button type="button" class="btn primary" id="ks-ayar-kaydet"'+(ks.tKirli?'':' disabled')+'>Kasa ayarlarını kaydet</button></div><p class="err" id="ks-ayar-err" hidden></p>';
  return h;
}
function ksTaslakDegisti(){
  ks.tKirli=true;
  var b=$('ks-ayar-kaydet'),d=$('ks-ayar-durum');if(b)b.disabled=false;if(d)d.textContent='Kaydedilmemiş değişiklikler var.';
  var t=$('ks-ac-top');if(t)t.textContent=tlPara((krs(ks.taslak.acilis.nakit)+krs(ks.taslak.acilis.banka))/100);
}
function ksAyarKaydet(){
  var t=ks.taslak,er=$('ks-ayar-err'),btn=$('ks-ayar-kaydet');
  function hata(m){er.textContent=m;er.hidden=false;}
  er.hidden=true;
  var a=t.acilis;
  if((a.nakit!==null||a.banka!==null)&&!a.tarih)return hata('Açılış tutarı yazdıysanız açılış tarihini de seçin.');
  var temiz=ksAyarTemiz({acilis:{tarih:a.tarih||'',nakit:a.nakit===null?0:a.nakit,banka:a.banka===null?0:a.banka},personel:t.personel,tedarik:t.tedarik,giderTur:t.giderTur});
  if(!a.tarih)temiz.acilis={tarih:'',nakit:null,banka:null};
  if(!temiz.personel.length)return hata('En az bir personel kalemi olmalı.');
  btn.disabled=true;btn.textContent='Kaydediliyor…';
  sb.from('kasa_ayar').upsert({id:'genel',veri:temiz},{onConflict:'id'}).then(function(r){
    btn.textContent='Kasa ayarlarını kaydet';
    if(r.error){btn.disabled=false;hata(ksHata(r.error));return;}
    ks.ayar=temiz;ks.ayarVar=true;ks.taslak=clone(temiz);ks.tKirli=false;
    if(ks.gun)ks.gun=ksSatirDoldur(ksGunTemiz(ksGunSade(ks.gun)));
    ksCiz();toast('Kasa ayarları kaydedildi.');
  }).catch(function(e){btn.disabled=false;btn.textContent='Kasa ayarlarını kaydet';hata(ksHata(e));});
}

/* --- olaylar --- */
function ksOrgBul(t){var k=t.closest('.kskart');return k?ks.gun.org[k.getAttribute('data-bant')][k.getAttribute('data-salon')]:null;}
$('ks').addEventListener('input',function(ev){
  var t=ev.target,f=t.getAttribute('data-f'),r;
  if(!ks.gun)return;
  /* kasa ayarları */
  if(ks.sekme==='ayar'){
    if(!st.admin||!ks.taslak)return;
    if(t.hasAttribute('data-ka')){var ka=t.getAttribute('data-ka');ks.taslak.acilis[ka]=ka==='tarih'?t.value:tlOku(t.value);ksTaslakDegisti();return;}
    r=t.closest('[data-kb]');
    if(r&&f){var kl=ks.taslak[r.getAttribute('data-kb')][+r.getAttribute('data-i')];kl[f]=f==='fiyat'?tlOku(t.value):t.value;ksTaslakDegisti();return;}
    if(t.hasAttribute('data-gt')){ks.taslak.giderTur[+t.getAttribute('data-gt')]=t.value;ksTaslakDegisti();}
    return;
  }
  if(ks.sekme!=='gun'||!ksYazabilir(ks.tarih))return;
  if(t.hasAttribute('data-kt')){ks.gun[t.getAttribute('data-kt')]=tlOku(t.value);ksOzetYaz();ksDegisti();return;}
  if((r=t.closest('[data-gl]'))&&f){ks.gun.gelir[+r.getAttribute('data-gl')][f]=f==='tutar'?tlOku(t.value):t.value;ksOzetYaz();ksDegisti();return;}
  if((r=t.closest('[data-gd]'))&&f){ks.gun.gider[+r.getAttribute('data-gd')][f]=f==='tutar'?tlOku(t.value):t.value;ksOzetYaz();ksDegisti();return;}
  if((r=t.closest('[data-hk]'))&&f==='hk'){ks.gun.hk[r.getAttribute('data-hk')]=t.value==='Banka'?'Banka':'Nakit';ksOzetYaz();ksDegisti(true);return;}
  var o=ksOrgBul(t);if(!o)return;
  if(t.hasAttribute('data-of')){
    var of=t.getAttribute('data-of');
    o[of]=of==='ad'?t.value:(of==='kisi'?parseN(t.value):tlOku(t.value));
    ksOzetYaz();ksDegisti();return;
  }
  var tutEl;
  if((r=t.closest('[data-hz]'))&&f){
    var hz=o.hizmet[+r.getAttribute('data-hz')];
    if(f==='ad')hz.ad=t.value;
    else if(f==='kisi'){hz.kisi=parseN(t.value);
      var fy=ksFiyat(ks.ayar.personel,hz.ad);
      if(!hz.el&&fy!==null){hz.tutar=hz.kisi?Math.round(hz.kisi*fy*100)/100:null;tutEl=r.querySelector('[data-f="tutar"]');if(tutEl)tutEl.value=tlYaz(hz.tutar);}}
    else if(f==='tutar'){hz.tutar=tlOku(t.value);hz.el=hz.tutar!==null;}
    ksOzetYaz();ksDegisti();return;
  }
  if((r=t.closest('[data-td]'))&&f){
    var td=o.tedarik[+r.getAttribute('data-td')];
    if(f==='tutar'){td.tutar=tlOku(t.value);td.el=td.tutar!==null;}
    else{
      if(f==='ad')td.ad=t.value;else td.miktar=tlOku(t.value);
      var ft=ksFiyat(ks.ayar.tedarik,td.ad);
      if(!td.el&&ft!==null){td.tutar=td.miktar?Math.round(td.miktar*ft*100)/100:null;tutEl=r.querySelector('[data-f="tutar"]');if(tutEl)tutEl.value=tlYaz(td.tutar);}
    }
    ksOzetYaz();ksDegisti();
  }
});
$('ks').addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='ks-tarih'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value))ksGit(t.value);else t.value=ks.tarih;return;}
  /* kutudan çıkınca tutar düzgün biçime çekilir */
  if(t.classList.contains('tl')){var n=tlOku(t.value);t.value=tlYaz(n);}
  if(t.tagName==='SELECT'&&ks.sekme==='gun'&&ksYazabilir(ks.tarih))ksDegisti(true);
});
$('ks').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-kssekme')){
    var hedef=b.getAttribute('data-kssekme');
    if(ks.sekme==='ayar'&&hedef!=='ayar'&&ks.tKirli){ks.taslak=clone(ks.ayar);ks.tKirli=false;}
    ks.sekme=hedef;if(hedef==='ay')ks.ay=ks.tarih.slice(0,7);ksCiz();return;
  }
  if(b.id==='ks-once'){ksGunKaydir(-1);return;}
  if(b.id==='ks-sonra'){ksGunKaydir(1);return;}
  if(b.id==='ks-bugun'){ksGit(todayStr());return;}
  if(b.hasAttribute('data-ksgun')){ks.sekme='gun';ksGit(b.getAttribute('data-ksgun'));return;}
  if(b.id==='ks-ay-once'||b.id==='ks-ay-sonra'){
    var y=+ks.ay.slice(0,4),m=+ks.ay.slice(5,7)+(b.id==='ks-ay-once'?-1:1);
    if(m<1){m=12;y--;}if(m>12){m=1;y++;}
    ks.ay=ymd(y,m,1).slice(0,7);ksCiz();return;
  }
  if(ks.sekme==='ayar'&&st.admin&&ks.taslak){
    if(b.hasAttribute('data-kbekle')){ks.taslak[b.getAttribute('data-kbekle')].push({ad:'',fiyat:null});ksCiz();ksTaslakDegisti();return;}
    if(b.hasAttribute('data-kbdel')){var r=b.closest('[data-kb]');ks.taslak[r.getAttribute('data-kb')].splice(+r.getAttribute('data-i'),1);ksCiz();ksTaslakDegisti();return;}
    if(b.id==='ks-tur-ekle'){ks.taslak.giderTur.push('');ksCiz();ksTaslakDegisti();return;}
    if(b.hasAttribute('data-gtdel')){ks.taslak.giderTur.splice(+b.getAttribute('data-gtdel'),1);ksCiz();ksTaslakDegisti();return;}
    if(b.id==='ks-ayar-kaydet'){ksAyarKaydet();return;}
    return;
  }
  if(!ks.gun||ks.sekme!=='gun'||!ksYazabilir(ks.tarih))return;
  if(b.id==='ks-gl-ekle'){ks.gun.gelir.push({ac:'',salon:'',kasa:'',tutar:null});ksCiz();var g=$('ks-gl-ac-'+(ks.gun.gelir.length-1));if(g)g.focus();return;}
  if(b.id==='ks-gd-ekle'){ks.gun.gider.push({ac:'',tur:'',kasa:'',tutar:null});ksCiz();var d=$('ks-gd-ac-'+(ks.gun.gider.length-1));if(d)d.focus();return;}
  var kart=b.closest('.kskart'),o=kart?ks.gun.org[kart.getAttribute('data-bant')][kart.getAttribute('data-salon')]:null;
  if(o&&b.hasAttribute('data-hzekle')){o.hizmet.push({ad:'',kisi:null,tutar:null,el:false});ksAcikKoru();return;}
  if(o&&b.hasAttribute('data-tdekle')){o.tedarik.push({ad:'',miktar:null,tutar:null,el:false});ksAcikKoru();}
});
/* Satır eklenince sayfa yeniden çizilir; açık / kapalı kartlar ve kaydırma yerinde kalır. */
function ksAcikKoru(){
  var acik={},y=window.scrollY;
  [].forEach.call(document.querySelectorAll('#ks .kskart'),function(k){acik[k.getAttribute('data-bant')+'-'+k.getAttribute('data-salon')]=k.open;});
  ksCiz();
  [].forEach.call(document.querySelectorAll('#ks .kskart'),function(k){var a=acik[k.getAttribute('data-bant')+'-'+k.getAttribute('data-salon')];if(a!==undefined)k.open=a;});
  window.scrollTo(0,y);
}

/* ---------- başlangıç ---------- */
renkYaz();
kapiCiz();
render();
(function boot(){
  if(!window.supabase||SB_URL.indexOf('__')===0||SB_KEY.indexOf('__')===0){st.oturum='ayarsiz';kapiCiz();render();return;}
  try{sb=window.supabase.createClient(SB_URL,SB_KEY);}
  catch(e){st.oturum='ayarsiz';kapiCiz();render();return;}
  /* İlk çağrı kayıtlı oturumu bildirir; sonraki çağrılar giriş ve çıkışları. */
  sb.auth.onAuthStateChange(function(olay,session){setTimeout(function(){oturumDegisti(session);},0);});
})();

})();
</script>
